# nginx proxy address - http://172.17.0.1:64311

name: poste
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  poste:
    image: analogic/poste.io:latest
    container_name: poste-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: poste-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Web interface
      HTTPS: 'OFF'
      # Bundled anti-virus and anti-spam scanners
      DISABLE_CLAMAV: ${DISABLE_CLAMAV:-TRUE}
      DISABLE_RSPAMD: ${DISABLE_RSPAMD:-FALSE}
    ports:
      - '172.17.0.1:64311:80'
      # Native mail protocol ports published by the mail server itself
      - '25:25'
      - '110:110'
      - '143:143'
      - '465:465'
      - '587:587'
      - '993:993'
      - '995:995'
    volumes:
      - './volumes/data/poste:/data:z'
    networks:
      - poste

networks:
  poste:
    name: poste
    external: false
